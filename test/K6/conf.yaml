            # - token-generator-creds
  - test_file: test/K6/user_stories/systemRegister/systemRegisterRights.js
    env_file: "test/K6/user_stories/common.env"
    contexts:
      - environment: at22
        test_type:
          enabled: false
        test_run:
          name: system-register-rights
          secrets:
            - br-test.2025-07-03
  - test_file: test/K6/user_stories/systemRegister/systemRegisterAccessPackages.js
    env_file: "test/K6/user_stories/common.env"
    contexts:
      - environment: at22
        test_type:
          enabled: false
        test_run:
          name: system-register-accesspackages
          secrets:
            - br-test.2025-07-03
